services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies the database migrations, then exits. Reuses the backend image and
  # overrides the entrypoint to run the migrate binary.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    # .env is the single source of truth. App/model settings (GEMINI_KEYS,
    # CHAT_MODEL, GEMINI_MODEL, CHUNK_*, etc.) come ONLY from env_file so a
    # stray exported shell var can't override them via ${VAR} substitution.
    # The `environment:` block below is limited to container-topology values
    # (db host, bind address, storage path) that must differ inside Compose.
    env_file:
      - .env
    volumes:
      # Persist locally-stored uploads across container restarts.
      - uploads_data:/app/uploads
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/uploads

  # Document-processing worker. Shares the same image and the uploads volume as
  # the backend; runs the worker binary instead of the API. Claims jobs from the
  # processing_jobs queue with bounded concurrency.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/worker"]
    restart: unless-stopped
    # Same rule as backend: model/tuning settings (GEMINI_KEYS, GEMINI_MODEL,
    # OCR_LANGUAGE, MAX_PAGE_WORKERS, CHUNK_*, job knobs) come ONLY from .env.
    # GEMINI_MODEL controls the table-extraction model; empty GEMINI_KEYS →
    # table extraction is skipped and text extraction still runs.
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/uploads

volumes:
  postgres_data:
  uploads_data:
