services:
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies the database migrations, then exits. Reuses the backend image and
  # overrides the entrypoint to run the migrate binary.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    # Load local .env as the single source of truth; explicit environment below
    # overrides where a container-specific value is required (e.g. db host).
    env_file:
      - .env
    volumes:
      # Persist locally-stored uploads across container restarts.
      - uploads_data:/app/uploads
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - API_V1_STR=${API_V1_STR:-/api}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-50}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - LOCAL_STORAGE_PATH=/app/uploads
      # Chat/RAG needs Gemini keys on the API too (answer generation).
      - GEMINI_KEYS=${GEMINI_KEYS:-}
      - CHAT_MODEL=${CHAT_MODEL:-gemini-2.0-flash}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}

  # Document-processing worker. Shares the same image and the uploads volume as
  # the backend; runs the worker binary instead of the API. Claims jobs from the
  # processing_jobs queue with bounded concurrency.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/worker"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - LOCAL_STORAGE_PATH=/app/uploads
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-2}
      - JOB_POLL_INTERVAL_MS=${JOB_POLL_INTERVAL_MS:-1000}
      - JOB_LOCK_TIMEOUT_MINUTES=${JOB_LOCK_TIMEOUT_MINUTES:-120}
      # GEMINI_KEYS empty → table extraction skipped; text extraction still runs.
      - GEMINI_KEYS=${GEMINI_KEYS:-}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
      - MAX_PAGE_WORKERS=${MAX_PAGE_WORKERS:-4}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}

volumes:
  postgres_data:
  uploads_data:
